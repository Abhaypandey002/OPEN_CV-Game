[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subway-vision-voice"
version = "0.1.0"
description = "Vision + voice controller for Subway Surfers"
authors = [{ name = "Subway Vision Voice" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
plugins = []

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]
